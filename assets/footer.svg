<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2185b"/>
      <stop offset="0.45" stop-color="#e75480"/>
      <stop offset="1" stop-color="#ff9ec4"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#fff" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="90" rx="14"/></clipPath>
    <path id="heart" d="M0,7 C-13,-3 -7,-15 0,-7 C7,-15 13,-3 0,7Z" fill="#fff"/>
    <path id="spark" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6Z" fill="#fff"/>
  </defs>

  <style>
    .beat    { animation: beat 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .d1 { animation-delay: .7s; } .d2 { animation-delay: 1.4s; }
    @keyframes beat    { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
    @keyframes twinkle { 0%,100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1.1); opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="90" fill="url(#bg)"/>
    <rect width="1200" height="90" fill="url(#dots)"/>

    <g transform="translate(120 45) scale(.7)"><use class="twinkle" href="#spark"/></g>
    <g transform="translate(300 30) scale(.5)"><use class="twinkle d1" href="#spark"/></g>
    <g transform="translate(900 60) scale(.5)"><use class="twinkle d2" href="#spark"/></g>
    <g transform="translate(1080 40) scale(.7)"><use class="twinkle d1" href="#spark"/></g>

    <g transform="translate(468 45)"><use class="beat" href="#heart"/></g>
    <g transform="translate(732 45)"><use class="beat" href="#heart"/></g>

    <text x="600" y="53" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
          font-size="24" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="1">Thanks for visiting</text>
  </g>
</svg>

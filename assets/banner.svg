<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ff9ec4"/>
      <stop offset="0.55" stop-color="#e75480"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#fff" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#7a0d3a" flood-opacity="0.35"/>
    </filter>
    <path id="heart" d="M0,7 C-13,-3 -7,-15 0,-7 C7,-15 13,-3 0,7Z" fill="#fff"/>
    <path id="spark" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6Z" fill="#fff"/>
  </defs>

  <style>
    .float  { animation: float 6s ease-in-out infinite; }
    .rise   { animation: rise 7s ease-in-out infinite; }
    .twinkle{ animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse  { animation: pulse 2.4s ease-in-out infinite; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; }
    .d4 { animation-delay: 1.6s; } .d5 { animation-delay: 2s; }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes rise    { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-14px); opacity: .8; } }
    @keyframes twinkle { 0%,100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes pulse   { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <circle cx="170" cy="50" r="190" fill="url(#glow)"/>
    <circle cx="1080" cy="280" r="210" fill="url(#glow)"/>

    <!-- low-poly mesh, top-left -->
    <g stroke="#fff" stroke-opacity="0.22" stroke-width="1" fill="none">
      <polyline points="0,40 70,10 140,45 220,0"/>
      <polyline points="0,40 50,95 140,45 120,0"/>
      <polyline points="70,10 50,95 0,130"/>
      <polyline points="140,45 210,70 220,0"/>
    </g>
    <g fill="#fff" fill-opacity="0.45">
      <circle cx="70" cy="10" r="2.5"/><circle cx="140" cy="45" r="2.5"/>
      <circle cx="50" cy="95" r="2.5"/><circle cx="210" cy="70" r="2.5"/>
    </g>

    <!-- low-poly mesh, bottom-right -->
    <g stroke="#fff" stroke-opacity="0.22" stroke-width="1" fill="none">
      <polyline points="1200,250 1130,285 1060,255 980,300"/>
      <polyline points="1200,250 1150,205 1060,255 1080,300"/>
      <polyline points="1130,285 1150,205 1200,170"/>
      <polyline points="1060,255 990,235 980,300"/>
    </g>
    <g fill="#fff" fill-opacity="0.45">
      <circle cx="1130" cy="285" r="2.5"/><circle cx="1060" cy="255" r="2.5"/>
      <circle cx="1150" cy="205" r="2.5"/><circle cx="990" cy="235" r="2.5"/>
    </g>

    <!-- wireframe 3D cube -->
    <g transform="translate(200 150)">
      <g class="float">
        <polygon points="0,-58 50,-29 0,0 -50,-29" fill="#fff" fill-opacity="0.28"/>
        <polygon points="-50,-29 0,0 0,58 -50,29" fill="#fff" fill-opacity="0.14"/>
        <polygon points="0,0 50,-29 50,29 0,58" fill="#fff" fill-opacity="0.06"/>
        <g stroke="#fff" stroke-width="2" stroke-linejoin="round" fill="none">
          <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29"/>
          <polyline points="-50,-29 0,0 50,-29"/>
          <line x1="0" y1="0" x2="0" y2="58"/>
        </g>
        <g fill="#fff">
          <circle cx="0" cy="-58" r="3.5"/><circle cx="50" cy="-29" r="3.5"/><circle cx="50" cy="29" r="3.5"/>
          <circle cx="0" cy="58" r="3.5"/><circle cx="-50" cy="29" r="3.5"/><circle cx="-50" cy="-29" r="3.5"/>
          <circle cx="0" cy="0" r="3.5"/>
        </g>
      </g>
    </g>

    <!-- AI neural network -->
    <g transform="translate(1000 150)">
      <g stroke="#fff" stroke-opacity="0.35" stroke-width="1.3">
        <line x1="-55" y1="-40" x2="0" y2="-60"/><line x1="-55" y1="-40" x2="0" y2="-20"/><line x1="-55" y1="-40" x2="0" y2="20"/>
        <line x1="-55" y1="0" x2="0" y2="-60"/><line x1="-55" y1="0" x2="0" y2="-20"/><line x1="-55" y1="0" x2="0" y2="20"/><line x1="-55" y1="0" x2="0" y2="60"/>
        <line x1="-55" y1="40" x2="0" y2="-20"/><line x1="-55" y1="40" x2="0" y2="20"/><line x1="-55" y1="40" x2="0" y2="60"/>
        <line x1="0" y1="-60" x2="55" y2="-20"/><line x1="0" y1="-20" x2="55" y2="-20"/><line x1="0" y1="-20" x2="55" y2="20"/>
        <line x1="0" y1="20" x2="55" y2="-20"/><line x1="0" y1="20" x2="55" y2="20"/><line x1="0" y1="60" x2="55" y2="20"/>
      </g>
      <g fill="#fff">
        <circle class="pulse"    cx="-55" cy="-40" r="6"/>
        <circle class="pulse d1" cx="-55" cy="0"   r="6"/>
        <circle class="pulse d2" cx="-55" cy="40"  r="6"/>
        <circle class="pulse d1" cx="0"   cy="-60" r="6"/>
        <circle class="pulse d3" cx="0"   cy="-20" r="6"/>
        <circle class="pulse d2" cx="0"   cy="20"  r="6"/>
        <circle class="pulse d4" cx="0"   cy="60"  r="6"/>
        <circle class="pulse d3" cx="55"  cy="-20" r="7"/>
        <circle class="pulse d5" cx="55"  cy="20"  r="7"/>
      </g>
    </g>

    <!-- floating hearts -->
    <g transform="translate(330 235) scale(.9)"><g class="rise"><use href="#heart"/></g></g>
    <g transform="translate(860 70) scale(.7)"><g class="rise d2"><use href="#heart"/></g></g>
    <g transform="translate(905 240) scale(1.1)"><g class="rise d4"><use href="#heart"/></g></g>
    <g transform="translate(290 65) scale(.6)"><g class="rise d3"><use href="#heart"/></g></g>
    <g transform="translate(1130 60) scale(.8)"><g class="rise d1"><use href="#heart"/></g></g>

    <!-- sparkles -->
    <g transform="translate(395 95)"><use class="twinkle" href="#spark"/></g>
    <g transform="translate(810 120) scale(.8)"><use class="twinkle d2" href="#spark"/></g>
    <g transform="translate(760 255) scale(.6)"><use class="twinkle d4" href="#spark"/></g>
    <g transform="translate(110 245) scale(.7)"><use class="twinkle d1" href="#spark"/></g>
    <g transform="translate(1110 125) scale(.6)"><use class="twinkle d3" href="#spark"/></g>
    <g transform="translate(470 265) scale(.5)"><use class="twinkle d5" href="#spark"/></g>

    <!-- text -->
    <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" fill="#fff" text-anchor="middle" filter="url(#shadow)">
      <text x="600" y="148" font-size="66" font-weight="800">Hi, I'm Iris</text>
      <text x="600" y="192" font-size="25" font-weight="600" letter-spacing="1">Professional 3D Artist</text>
      <text x="600" y="232" font-size="14" font-weight="600" letter-spacing="4" fill-opacity="0.85">3D ART  ✦  CHARACTERS  ✦  AI</text>
    </g>
  </g>
</svg>
